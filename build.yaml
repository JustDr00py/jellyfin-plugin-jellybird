overview: "Trigger jellybird syncs and search/add debrid content from inside Jellyfin."
description: >
  Thin connector plugin for jellybird (https://github.com/JustDr00py/jellybird).
  jellybird runs as a standalone service that writes .strm files for
  debrid-hosted (RealDebrid/TorBox) content; this plugin adds a Jellyfin
  scheduled task to trigger an on-demand sync, and a dashboard page to
  discover and search TMDB titles, add them to the debrid cloud, and manage
  the cloud and server-side local copies, all by calling
  jellybird's existing REST API. It does not duplicate jellybird's own
  logic or touch the Jellyfin media library directly.
category: "General"
owner: "JustDr00py"
