changelog: |
  ## Unreleased
  - Discover tab: browse trending/popular/top-rated/genre movies and shows,
    with in-library labels and a "hide what I have" filter.
  - Cloud tab: list debrid torrents, Keep local, Delete.
  - Local files tab: server-side copies with progress, Cancel/Retry/Move/Remove.
  - Escape TMDB/torrent text before it reaches the page.

